<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenshop</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./CeraProfont/font.css" />
  </head>
  <body>
    <header class="header">
      <a href="/"
        ><img class="header_logo" src="./img/Logo.svg" alt="Greenshop"
      /></a>
      <nav class="header_nav">
        <ul>
          <li class="link_Home header_list">
            <a class="header_link" href="">Home</a>
          </li>
          <li class="link_Shop header_list">
            <a class="header_link" href="">Shop</a>
          </li>
          <li class="link_PlantCare header_list">
            <a class="header_link" href="">Plant Care</a>
          </li>
          <li class="link_Blogs header_list">
            <a class="header_link" href="">Blogs</a>
          </li>
        </ul>
      </nav>
      <button class="header_button">
        <img class="button_image" src="./img/Logout.svg" alt="" /><span
          class="login_button"
          >Login</span
        >
      </button>
    </header>

    <main class="first_content">
      <section>
        <div class="main_text">
          <p class="first_paragraph">Welcome to GreenShop</p>
          <h1 class="first_main_text">
            Let’s Make a Better <span>Planet</span>
          </h1>
          <p class="second_main_text">
            We are an online plant shop offering a wide range of cheap and
            trendy plants. Use our plants to create an unique Urban Jungle.
            Order your favorite plants!
          </p>
          <button class="main_button">SHOP NOW</button>
        </div>
        <div class="img_container">
          <a href="/"
            ><img class="main_img" src="./img/main_img.png" alt="Flower"
          /></a>
        </div>
      </section>
    </main>
  </body>
</html>
